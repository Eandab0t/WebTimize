[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "webtim"
dynamic = ["version"]
description = "WebTimize Compressor: local static-site optimizer with reporting and safe staged output"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "htmlmin2>=0.1.13",
    "rjsmin>=1.2",  # replaced jsmin: it drops spaces inside template literals
    "cssmin>=0.2",
    "brotli>=1.0",
]

[project.optional-dependencies]
images = ["Pillow>=10"]   # needed for --webp / --avif
test = ["pytest", "Pillow>=10"]

[project.scripts]
webtim = "webtim.cli:main"
webtim-serve = "webtim.serve:main"

[tool.setuptools]
packages = ["webtim"]

[tool.setuptools.dynamic]
version = {attr = "webtim.__version__"}

[tool.pytest.ini_options]
cache_dir = "__development/cache/pytest"
